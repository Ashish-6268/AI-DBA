<!DOCTYPE html>
<html>
<head>
  <title>AI Database Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 80vh;
    }
    .chat-header {
      background: #111827;
      color: white;
      padding: 16px;
      font-weight: bold;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 12px;
    }
    .user {
      text-align: right;
      color: #2563eb;
    }
    .bot {
      text-align: left;
      color: #111827;
    }
    .input-area {
      display: flex;
      border-top: 1px solid #eee;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
      resize: none;
      height: 44px;
      max-height: 120px;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      line-height: 1.4;
    }
    button {
      padding: 12px 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      height: 44px;
    }
    button:hover {
      background: #1e40af;
    }
    .hint {
      font-size: 10px;
      color: #9ca3af;
      padding: 4px 12px;
      background: white;
    }
    pre {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .thinking {
      color: #9ca3af;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">🤖 AI Database Agent</div>
  <div class="chat-box" id="chat"></div>
  <div class="hint">Enter to send · Shift+Enter for new line</div>
  <div class="input-area">
    <textarea id="message" placeholder="Ask about your database..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>
<script>
  // Enter = send, Shift+Enter = new line
  document.getElementById("message").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const text = input.value.trim();
    if (!text) return;

    // Show user message
    chat.innerHTML += `<div class="message user">${text.replace(/\n/g, "<br/>")}</div>`;
    input.value = "";
    input.style.height = "44px";

    // Show thinking indicator
    const thinkingId = "thinking-" + Date.now();
    chat.innerHTML += `<div class="message bot thinking" id="${thinkingId}">⏳ Thinking...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("http://localhost:5000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();

      // Remove thinking indicator
      document.getElementById(thinkingId).remove();

      if (data.error) {
        chat.innerHTML += `<div class="message bot">❌ ${data.error}</div>`;
      } else {
        chat.innerHTML += `
          <div class="message bot">
            <strong>Answer:</strong><br/>
            ${data.answer}
            <br/><br/>
            <strong>SQL:</strong>
            <pre>${data.sql}</pre>
          </div>
        `;
      }
    } catch (err) {
      document.getElementById(thinkingId).remove();
      chat.innerHTML += `<div class="message bot">❌ Could not reach server.</div>`;
    }

    chat.scrollTop = chat.scrollHeight;
  }
</script>
</body>
</html>
