<!DOCTYPE html>
<html>
<head>
  <title>AI Database Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #111827;
      color: white;
      padding: 16px;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
    }

    .user {
      text-align: right;
      color: #2563eb;
    }

    .bot {
      text-align: left;
      color: #111827;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    pre {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="chat-container">
  <div class="chat-header">🚀 AI Database Agent</div>

  <div class="chat-box" id="chat"></div>

  <div class="input-area">
    <input id="message" placeholder="Ask about your database..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const text = input.value.trim();
  if (!text) return;

  // Show user message
  chat.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  // Call backend
  const res = await fetch("http://localhost:5000/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  if (data.error) {
    chat.innerHTML += `<div class="message bot">❌ ${data.error}</div>`;
  } else {
    chat.innerHTML += `
      <div class="message bot">
        <strong>Answer:</strong><br/>
        ${data.answer}
        <br/><br/>
        <strong>SQL:</strong>
        <pre>${data.sql}</pre>
      </div>
    `;
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
